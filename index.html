<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="mainContainer">
      <div class="container">
        ```
        <div class="inputContainer">
          <input id="input" type="text" placeholder="Search city..." />

          <button onclick="fetchWheather()" aria-label="Search">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div class="wheatherContainer">
          <h2 id="title">KARACHI</h2>

          <!-- Simple weather SVG -->
          <svg
            class="weatherIcon"
            width="90"
            height="90"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="50" cy="50" r="22" fill="currentColor" />

            <path
              d="M50 12V24"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M50 76V88"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M12 50H24"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M76 50H88"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />

            <path
              d="M23 23L31 31"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M69 69L77 77"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M77 23L69 31"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M31 69L23 77"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
          </svg>

          <h2 id="temp">9°C</h2>
        </div>

        <div class="detailContainer">
          <div class="detail">
            <div class="svgContainer">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 3C12 3 5 10 5 15C5 18.866 8.134 21 12 21C15.866 21 19 18.866 19 15C19 10 12 3 12 3Z"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>

            <span>HUMIDITY</span>
            </div>

            <div id="humidity">
                20
            </div>
          </div>

          <div class="detail">
            <div class="svgContainer">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3 8H15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M3 12H21"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M3 16H17"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>

            <span>WIND</span>
            </div>
            <div id="wind">20 Km/h</div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    ```
  </body>
</html>
